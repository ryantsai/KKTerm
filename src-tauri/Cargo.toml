[package]
name = "kkterm"
version = "3000.0.7"
description = "Fast local-first administration workspace for terminals, SSH, SFTP, and approval-based command assistance."
authors = ["Ryan Tsai"]
license-file = "../LICENSE"
edition = "2024"
rust-version = "1.97.1"
default-run = "kkterm"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kkterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
dotenvy = "0.15"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-proxy"] }
tauri-plugin-opener = "2"
anyhow = "1.0.102"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "form", "blocking", "socks"] }
sha2 = "0.11"
ed25519-dalek = "2"
semver = "1"
mime_guess = "2"
aes-gcm = "0.11"
argon2 = "0.5.3"
# Do not enable default features here: github-copilot-sdk defaults to bundling
# the Copilot CLI, which bloats the KKTerm installer by embedding a large binary.
github-copilot-sdk = { version = "1.0.6", default-features = false }
rand = "0.10"
base64 = "0.23"
# Document Connection text decoding: encoding_rs is the standard (Firefox) decoder
# and chardetng its companion charset detector, used for the file viewer's
# Auto/named-encoding text reads. See file_viewer.rs::read_text.
encoding_rs = "0.8"
chardetng = "1"
regex = "1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
webp = { version = "=0.3.1", default-features = false }
# System font enumeration: parse the `name` table of installed font files to
# list available families cross-platform, without pulling native fontconfig /
# DirectWrite / Core Text bindings into the build.
ttf-parser = "0.25"
portable-pty = "0.9.0"
keyring-core = "1.0.0"
# 0.62.5 includes the stabilized RustCrypto/Dalek dependency line and upstream
# panic/security fixes. It does NOT fix the compression.rs compress_into
# truncation that corrupts the
# stream when zlib output exceeds input+10 bytes (incompressible SFTP uploads).
russh = { version = "=0.62.5", default-features = false, features = ["des", "flate2", "ring", "rsa"] }
russh-sftp = "2.4.0"
suppaftp = { version = "10.0.0", default-features = false, features = ["tokio", "tokio-async-native-tls", "deprecated"] }
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
serial2 = "0.2.37"
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2"
scraper = "0.27"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
vnc = { package = "vnc-rs", path = "vendor/vnc-rs" }
time = { version = "0.3", features = ["formatting", "macros", "local-offset", "parsing"] }
zip = "8"
# IPAM .xlsx import only. Optional date/picture features stay disabled; the
# crate shares KKTerm's existing zip 8 / quick-xml 0.41 / encoding_rs tree.
calamine = { version = "0.36", default-features = false }
futures = "0.3"
rayon = "1.11"
filedescriptor = "0.8.3"
lazy_static = "1.5.0"
shared_library = "0.1.9"
winapi = "0.3.9"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
# Direct WS-Man transport for IT Ops Windows execution. Default features keep
# the production path pure Rust (NTLMv2/Basic over reqwest+rustls); CredSSP is
# intentionally not enabled because upstream marks it experimental.
winrm-rs = { version = "1.1.2", default-features = false }

# AST-based validation of AI-authored script widget source. oxc is ~3x faster
# than swc on the parse-only path and ships a stable visitor API for
# IdentifierReference walks. Used by validate_script_body_json_detailed.
oxc_allocator = "0.143"
oxc_parser = "0.143"
oxc_span = "0.143"
oxc_ast = "0.143"
oxc_ast_visit = "0.143"
tauri-plugin-single-instance = "2"
tauri-plugin-drag = "2.1.1"
arboard = { version = "3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }

# Network admin tools - AV-friendly choices.
# MVP scope: DNS, ping, port scan/check, WoL, interfaces, WHOIS. SNMP + traceroute deferred.
hickory-resolver = "0.26"
if-addrs = "0.15"
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["ApplicationModel", "ApplicationModel_DataTransfer", "Foundation", "Management_Deployment", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_Graphics", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-collections = "0.3.2"
# Keep these on Wry's binding line so WebView2 COM interface values use the
# same windows-core ABI. Revisit together when Tauri/Wry updates webview2-com.
windows-core = "=0.61.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Environment", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-native-keyring-store = "1.1.0"
webview2-com = "=0.38.2"
# Default screen-capture engine (Windows Graphics Capture via `wgc`), with the
# native GDI path in screenshot.rs as fallback. Shares the existing windows 0.62
# / image 0.25 tree, so this adds no new transitive crates on Windows.
xcap = { version = "0.9", default-features = false, features = ["image", "wgc"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }
security-framework = "3.7.0"
# Host monitoring (Status Bar CPU/RAM/Network + detailed Dashboard counters).
# Shared with Linux (see the Linux target block); the Windows path uses
# hand-rolled Win32 calls in performance.rs.
sysinfo = "0.39"
# CFString construction for the IOKit power assertion used by Don't Sleep.
# IOKit itself links as a system framework via #[link] in power.rs.
core-foundation-sys = "0.8"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSWindow",
    # App Launcher Finder icons: NSWorkspace.iconForFile -> NSImage ->
    # NSBitmapImageRep PNG export.
    "NSWorkspace",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    "NSGraphics",
    # Native macOS text paste for the IronRDP canvas. WKWebView may deliver
    # Command+V without exposing usable ClipboardEvent data.
    "NSPasteboard",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
    "NSData",
    "NSDictionary",
    "NSGeometry",
] }

[target.'cfg(all(target_os = "windows", any(target_arch = "x86", target_arch = "x86_64")))'.dependencies]
# AV mitigation #1: use IcmpSendEcho2 via winping (NOT raw sockets) on Windows.
winping = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
# Dashboard PC Info enrichment on Linux (CPU brand/cores/frequency, disks,
# network adapters + MAC/IP) plus host monitoring (Status Bar CPU/RAM/Network
# and detailed Dashboard counters). Windows uses CIM / hand-rolled Win32 calls.
sysinfo = "0.39"
# Don't Sleep: D-Bus idle/suspend inhibitors (xdg-desktop-portal with an
# org.freedesktop.ScreenSaver fallback). Already in the tree via
# tauri-plugin-opener/xcap, so this adds no new build cost.
zbus = "5"

[target.'cfg(not(target_os = "windows"))'.dependencies]
tempfile = "3.27.0"
# Unix ICMP via surge-ping (raw sockets - Unix users typically have CAP_NET_RAW or root).
# Windows uses winping instead (see Windows target block above).
surge-ping = "0.9"
# Cross-platform battery info for the Dashboard PC Info widget (IOKit on macOS,
# sysfs on Linux). Windows reads batteries via CIM. `starship-battery` is the
# maintained fork of the `battery` crate; aliased so the code can `use battery`.
battery = { package = "starship-battery", version = "0.11" }
# macOS/Linux RDP client via IronRDP (Windows uses the native ActiveX path in rdp.rs instead).
# The umbrella crate pins a mutually-compatible sub-crate set.
# ironrdp-tokio re-exports all of ironrdp-async (connect_begin, connect_finalize,
# mark_as_upgraded, NetworkClient) via `pub use ironrdp_async::*`, so no separate
# ironrdp-async dep is needed. The umbrella `input` feature re-exports ironrdp-input v0.6,
# so no separate ironrdp-input dep is needed either.
ironrdp = { version = "0.16", features = ["connector", "session", "graphics", "pdu", "input", "cliprdr", "rdpdr", "rdpsnd", "svc"] }
ironrdp-rdpdr-native = "0.6"
ironrdp-tokio = "0.9"
tokio-rustls = "0.26"
# Legacy TLS fallback for the RDP upgrade (issue #344): rustls only speaks
# TLS 1.2/1.3 with ECDHE+AEAD suites, which old Windows Schannel configs
# (Win7/2008 R2 default to TLS 1.0; 2012/2012 R2 offer only CBC suites with RSA
# certs) reject by resetting the connection mid-handshake. native-tls rides the
# platform stack (SecureTransport on macOS, OpenSSL on Linux) which still
# supports those suites. native-tls itself is already in the tree via
# suppaftp/async-native-tls; this only adds the small tokio adapter.
tokio-native-tls = "0.3"
# Direct rustls use for the RDP TLS upgrade (no-cert-verify + ring provider). RDP
# wraps its own CredSSP auth inside TLS, so chain verification is intentionally
# skipped; `ring` matches the provider selected in rdp_client.rs::tls_upgrade.
rustls = { version = "0.23", features = ["ring"] }
# Parse the server certificate's SubjectPublicKeyInfo for the CredSSP public-key binding.
x509-cert = "0.3"
# Cross-platform screen/window capture engine (see the Windows entry above for
# the `wgc`-enabled counterpart). `image` feature exposes capture_image().
xcap = { version = "0.9", default-features = false, features = ["image"] }
# NOTE: sspi = "0.21" (needed for CredSSP/NTLM) is a transitive dep of ironrdp-connector.
# It is omitted here as a direct dep because ironrdp-connector already pulls it in.
# To add direct sspi usage in Task 4: sspi = { version = "0.21", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# App Launcher: real themed icons on Linux/BSD. The GLib/GIO/gdk-pixbuf bindings
# are already pulled in transitively by Tauri's GTK stack, so they add no bundle
# weight here; freedesktop-icons is a small pure-Rust XDG icon-theme resolver.
glib = "0.18"
gio = "0.18"
gdk-pixbuf = "0.18"
freedesktop-icons = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
# Unwind (not "abort") so a panic in a background worker — e.g. an SSH port
# forward task, or a third-party `Drop` such as russh closing a channel via
# `tokio::spawn` during teardown — terminates only that worker thread instead of
# aborting the whole app. The SSH worker additionally catches and logs panics
# (see `run_native_terminal_thread`). Costs a little binary size vs. "abort".
panic = "unwind"
opt-level = "s"

[profile.dev]
opt-level = 1

[patch.crates-io]
# Temporary downstream application of Devolutions/IronRDP#1363 so russh 0.62.5
# and the macOS/Linux IronRDP client share one RustCrypto/Dalek line. IronRDP
# 0.17 still pins picky 7.0.0-rc.25, whose prerelease crypto dependencies
# conflict with KKTerm's stable aes-gcm 0.11 dependency. Remove these patches
# once IronRDP publishes its connector against the aligned picky/sspi releases.
picky = { path = "vendor/picky-rs-russh-061/picky" }
picky-asn1 = { path = "vendor/picky-rs-russh-061/picky-asn1" }
picky-asn1-der = { path = "vendor/picky-rs-russh-061/picky-asn1-der" }
picky-asn1-x509 = { path = "vendor/picky-rs-russh-061/picky-asn1-x509" }
picky-krb = { path = "vendor/picky-rs-russh-061/picky-krb" }
sspi = { path = "vendor/sspi-rs-russh-061" }
ironrdp-connector = { path = "vendor/ironrdp-russh-061/crates/ironrdp-connector" }

[dev-dependencies]
tempfile = "3.27.0"
# Enables tauri::test::mock_app() so unit tests can build an AppHandle.
tauri = { version = "2", features = ["test"] }





















[[bin]]
name = "kkterm-cli"
path = "src/bin/kkterm-cli.rs"
