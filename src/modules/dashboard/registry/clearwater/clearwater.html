<style>

  html, body { margin:0; height:100%; background:#0d2a2a; overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:grab; }
  canvas:active { cursor:grabbing; }
  #hint { position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%);
    font:500 14px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color:var(--ink);
    padding:10px 16px; border-radius:999px; background:rgba(10,30,30,.28); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    letter-spacing:.01em; white-space:nowrap; transition:opacity 1.2s ease; pointer-events:none; }
  #hint.off { opacity:0; }
  #err { position:fixed; inset:auto 12px calc(12px + env(safe-area-inset-bottom,0px)) 12px; max-height:45%; overflow:auto;
    font:12px/1.45 ui-monospace, Menlo, monospace; color:#ffd9d2; background:rgba(40,8,8,.92); border-radius:14px; padding:12px 14px; white-space:pre-wrap; z-index:9; }
  #err[hidden], #dbg[hidden] { display:none; }
  #dbg { position:fixed; top:calc(58px + env(safe-area-inset-top,0px)); left:10px; font:11px/1.4 ui-monospace, Menlo, monospace; color:#fff;
    background:rgba(0,0,0,.35); padding:6px 8px; border-radius:8px; z-index:8; pointer-events:none; }
  #credit { position:fixed; left:calc(14px + env(safe-area-inset-left,0px)); top:calc(14px + env(safe-area-inset-top,0px)); z-index:5;
    display:flex; align-items:center; gap:2px; padding:4px; border-radius:999px; background:rgba(10,30,30,.28);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    font:500 12px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; letter-spacing:.01em; }
  #credit a { display:flex; align-items:center; gap:7px; padding:4px 10px 4px 4px; border-radius:999px; color:rgba(255,255,255,.62);
    text-decoration:none; transition:color .2s ease, background .2s ease; }
  #credit a:hover, #credit a:focus-visible { color:#fff; background:rgba(255,255,255,.08); outline:none; }
  #credit img { width:22px; height:22px; border-radius:50%; object-fit:cover; }
  #credit .wm { height:15px; width:auto; margin:0 2px 0 6px; display:block; }
  #credit i { width:1px; height:14px; background:rgba(255,255,255,.18); }
  @media (prefers-reduced-motion: reduce) { #hint { transition:none; } }
  /* KKTerm wallpaper: fixed overhead camera, no demo controls. */
  #hint, #credit, #dbg { display: none !important; }
  #c { pointer-events: none; cursor: default; }
</style>

const $err = document.getElementById('err');
function fail(msg){ console.warn("Clearwater background unavailable:", typeof msg==='string'?msg:(msg&&msg.stack)||String(msg)); }

const Q = new URLSearchParams(location.search);
const FIXED_T = Q.has('t') ? parseFloat(Q.get('t')) : null;

/* ---------------- GL helpers ---------------- */
function sh(type, src, name){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    const lines = src.split('\n').map((l,i)=>`${String(i+1).padStart(3)}  ${l}`);
    const m = /ERROR: \d+:(\d+)/.exec(log); const ln = m? +m[1] : 0;
    fail(`Shader "${name}":\n${log}\n` + (ln? lines.slice(Math.max(0,ln-4), ln+2).join('\n') : ''));
    throw new Error('shader '+name);
  }
  return s;
}
function prog(vs, fs, name){
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs, name+'.vs'));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs, name+'.fs'));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { fail(`Link "${name}": ${gl.getProgramInfoLog(p)}`); throw 0; }
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i=0;i<n;i++){ const info = gl.getActiveUniform(p,i); u[info.name.replace(/\[0\]$/,'')] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
function tex(w, h, fmt, { filter=gl.LINEAR, wrap=gl.CLAMP_TO_EDGE, mip=false, aniso=0 } = {}){
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);

  gl.texStorage2D(gl.TEXTURE_2D, levels, fmt, w, h);

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);

const VS = `#version 300 es
layout(location=0) in vec2 p; out vec2 vUv;
void main(){ vUv = p*.5+.5; gl_Position = vec4(p,0.,1.); }`;

precision highp float; precision highp sampler2D; precision highp int;
in vec2 vUv; out vec4 o;
`;

/* ---------------- Ocean spectrum (FFT) ---------------- */
const N = 256, LOGN = 8;
const L = 4.6;               // patch size (m)
const DEPTH = 1.6;          // mean depth (m)
const TARGET_SLOPE = 0.078;  // RMS slope

function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const rnd = mulberry(7);
function gauss(){ let u=0,v=0; while(!u) u=rnd(); v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

function buildH0(){
  const kp = 2*Math.PI/0.62, kcut = 2*Math.PI/0.045;
  const wd = [0.8, 0.6];
  const re = new Float32Array(N*N), im = new Float32Array(N*N);
  let s2 = 0;
  for (let m=0;m<N;m++) for (let n=0;n<N;n++){
    const nx = n<N/2? n : n-N, nz = m<N/2? m : m-N;
    const kx = 2*Math.PI*nx/L, kz = 2*Math.PI*nz/L, k = Math.hypot(kx,kz);
    let P = 0;
    if (k>1e-6){

      const bump = Math.exp(-0.5*(lk/0.36)**2);
      const tail = 0.035*Math.exp(-((kp/k)**2))*Math.exp(-((k/kcut)**2));
      const swell = 0.35*Math.exp(-0.5*(Math.log(k/(2*Math.PI/1.6))/0.3)**2);

  const data = new Float32Array(N*N*4);

}
